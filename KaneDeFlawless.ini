[General]
; 1 escribe KaneDeFlawless.log; 0 desactiva completamente el log.
; Valores permitidos: 0 o 1.
Logging=1

[Display]
; 1 activa la correccion FOV; 0 deja el juego sin modificar.
; Valores permitidos: 0 o 1.
Enabled=1
; FOV adicional en grados. Rango permitido: -30.0 a 30.0.
AdditionalFOV=0.0
; Relacion de aspecto original. 16:9 = 1.777777791.
; Rango permitido: 0.5 a 4.0.
DefaultAspectRatio=1.777777791
; Limite superior del FOV corregido. Rango permitido: 30.0 a 110.0.
FOVMax=110.0

[Debug]
; 1 instala el hook sin modificar el FOV. Uso diagnostico solamente.
; Valores permitidos: 0 o 1.
Passthrough=0
